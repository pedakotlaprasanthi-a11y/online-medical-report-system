apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-report-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-report
  template:
    metadata:
      labels:
        app: medical-report
    spec:
      containers:
        - name: medical-report
          image: medical-report-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: medical-report-service
spec:
  type: NodePort
  selector:
    app: medical-report
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
